<!doctype html><html lang="zh"><meta charset="utf-8"><title>Reference Repair Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eeef;color:#243e40;font:14px system-ui}header,aside,footer{background:white;padding:14px;border-bottom:1px solid #ccd8d8}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}h2{margin:0 14px 0 0;font-size:18px}button,select,input{font:inherit}button,select{background:white;border:1px solid #bdccca;border-radius:6px;padding:7px;cursor:pointer}button:hover{background:#e2f3ee}button.primary{background:#167c69;color:white;border-color:#167c69}button:disabled{opacity:.45}main{display:grid;grid-template-columns:minmax(0,1fr) 270px;min-height:75vh}section{padding:14px;min-width:0}aside{border-left:1px solid #ccd8d8;display:flex;flex-direction:column;gap:10px}#stage{position:relative;line-height:0;background:#cfd9d8;box-shadow:0 3px 14px #0002}canvas{display:block;width:100%;height:auto;touch-action:none}#status{padding:12px;line-height:1.5}label{display:inline-flex;gap:5px;align-items:center}#obj{width:100%}small{color:#56706e;line-height:1.5}#coords input{width:60px} .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px} @media(max-width:850px){main{display:block}aside{border:0}}
</style><header><h2>Reference Repair Studio</h2><label>PPTX <input id="ppt" type="file" accept=".pptx"></label><label>原图 <input id="ref" type="file" accept="image/*"></label><button id="load">载入 PPTX</button><select id="page"></select><button id="export" class="primary">导出 PPTX</button></header><main><section><div class="bar"><select id="tool"><option value="rect">矩形</option><option value="round">圆角矩形</option><option value="circle">圆形</option><option value="ellipse">椭圆</option><option value="lasso">自由套索</option><option value="brush">画笔</option><option value="lens">原图透镜</option><option value="object">对象选择</option></select><select id="combine"><option value="replace">新选区</option><option value="add">增加</option><option value="subtract">减去</option></select><label>画笔 <input id="size" type="range" min="6" max="180" value="45"></label><label>原图叠加 <input id="opacity" type="range" min="0" max="100" value="0"></label><button id="diff">差异</button><button id="undo">撤销</button><button id="redo">重做</button></div><div id="stage"><canvas id="view" width="1600" height="900"></canvas></div><div id="status">先上传 PPTX 与当前页原始设计图。</div></section><aside><b>局部修复</b><label><input type="checkbox" id="protect" checked>保护现有文字框区域</label><label><input type="checkbox" id="behind">插入选中对象下方</label><label><input type="checkbox" id="cut">去除近白色背景（图标）</label><button class="primary" id="apply">原位恢复 / 独立取件</button><button id="clear">清除选区</button><button id="preview">重新渲染真实 PPTX</button><small>选区提取为独立透明 PNG；保护文字按现有文本框边界遮罩，不保证去除错位的原图文字。复杂插画建议先删除错误图片，再选区恢复。</small><hr><b>原生 PPT 对象</b><select id="obj" size="8"></select><div class="bar"><button data-op="delete">删除</button><button data-op="front">置顶</button><button data-op="back">置底</button></div><div id="coords">X <input id="x" type="number" step=".001"> Y <input id="y" type="number" step=".001"><br>W <input id="w" type="number" step=".001"> H <input id="h" type="number" step=".001"><br>字号 <input id="font" type="number" min="1" max="200"> pt</div><button id="layout">调整对象</button><small>坐标为页面比例（0–1）。对象级操作需要重新渲染以核验。支持逐页上传参考图。</small><hr><b>修复记录</b><div id="history"></div></aside></main><footer>本地运行 · 不调用 AI API · Q 临时查看原图 · Shift 增选 · Alt/Option 减选 · Ctrl/Cmd+Z 撤销</footer><script>
const $=id=>document.getElementById(id),v=$('view'),c=v.getContext('2d'),mk=()=>document.createElement('canvas');let mask=mk(),temp=mk(),refcan=mk(),meta,source,pg=0,refs={},base=[],ops=[],redo=[],rendered=0,drag=null,hover=null,heat=false,peek=false,patchImages=new Map(),busy=false;const status=t=>$('status').textContent=t;const file=f=>new Promise((a,b)=>{let r=new FileReader;r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)}),image=s=>new Promise((a,b)=>{let i=new Image;i.onload=()=>a(i);i.onerror=b;i.src=s});
async function post(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error((await r.text()).slice(0,300));return r}async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){status('错误：'+e.message)}finally{busy=false}}
function size(){for(let q of [mask,temp,refcan]){q.width=v.width;q.height=v.height}}function clear(){mask.getContext('2d').clearRect(0,0,v.width,v.height);draw()}function reference(){let x=refcan.getContext('2d');x.clearRect(0,0,v.width,v.height);if(refs[pg])x.drawImage(refs[pg],0,0,v.width,v.height)}function active(){return meta?.objects[pg].find(o=>o.id===+$('obj').value)}function draw(){c.clearRect(0,0,v.width,v.height);if(base[pg])c.drawImage(base[pg],0,0,v.width,v.height);for(let o of ops.slice(rendered))if(o.slide===pg&&o.kind==='patch'&&patchImages.has(o)){let b=o.box;c.drawImage(patchImages.get(o),b[0]*v.width,b[1]*v.height,b[2]*v.width,b[3]*v.height)}if(refs[pg]){if(heat){let a=c.getImageData(0,0,v.width,v.height),b=refcan.getContext('2d').getImageData(0,0,v.width,v.height);for(let i=0;i<a.data.length;i+=4){let d=Math.abs(a.data[i]-b.data[i])+Math.abs(a.data[i+1]-b.data[i+1])+Math.abs(a.data[i+2]-b.data[i+2]);if(d>120){a.data[i]=255;a.data[i+1]*=.45;a.data[i+2]*=.45}}c.putImageData(a,0,0)}c.globalAlpha=peek?1:+$('opacity').value/100;c.drawImage(refcan,0,0);c.globalAlpha=1;if($('tool').value==='lens'&&hover){c.save();c.beginPath();c.arc(...hover,80,0,Math.PI*2);c.clip();c.drawImage(refcan,0,0);c.restore();c.beginPath();c.arc(...hover,80,0,Math.PI*2);c.strokeStyle='#fff';c.lineWidth=3;c.stroke()}}c.globalAlpha=.25;c.drawImage(mask,0,0);if(drag)c.drawImage(temp,0,0);c.globalAlpha=1;if($('tool').value==='object'&&active()){let b=active().box;c.strokeStyle='#1269dd';c.lineWidth=3;c.strokeRect(b[0]*v.width,b[1]*v.height,b[2]*v.width,b[3]*v.height)}}
function list(){let deleted=new Set(ops.filter(o=>o.slide===pg&&o.kind==='delete').map(o=>o.id));$('obj').replaceChildren(...(meta?.objects[pg]||[]).filter(o=>!deleted.has(o.id)).slice().reverse().map(o=>new Option(o.id+' '+(o.text||o.name).slice(0,32),o.id)));select();$('history').textContent=ops.length+' 项操作（当前会话）'}function select(){let o=active();if(o)for(let [i,k] of ['x','y','w','h'].entries())$(k).value=o.box[i].toFixed(4);draw()}
$('load').onclick=()=>run(async()=>{if(!$('ppt').files[0])throw Error('请选择 PPTX');status('正在解析并渲染…');source=await file($('ppt').files[0]);meta=await(await post('/inspect',{pptx:source})).json();base=await Promise.all(meta.pages.map(image));ops=[];redo=[];rendered=0;pg=0;refs={};v.width=meta.width;v.height=meta.height;size();$('page').replaceChildren(...base.map((_,i)=>new Option('第 '+(i+1)+' 页',i)));if($('ref').files[0])refs[0]=await image(await file($('ref').files[0]));reference();list();status('已载入；请选择区域后恢复。')});$('ref').onchange=()=>run(async()=>{if($('ref').files[0]){refs[pg]=await image(await file($('ref').files[0]));reference();draw()}});$('page').onchange=()=>{pg=+$('page').value;clear();reference();list()};$('obj').onchange=select;for(let id of ['tool','opacity'])$(id).oninput=draw;$('diff').onclick=()=>{heat=!heat;draw()};$('clear').onclick=clear;
function point(e){let r=v.getBoundingClientRect();return [Math.max(0,Math.min(v.width,(e.clientX-r.left)*v.width/r.width)),Math.max(0,Math.min(v.height,(e.clientY-r.top)*v.height/r.height))]}function selection(){let t=temp.getContext('2d'),p=drag.pts,a=p[0],b=p.at(-1),x=Math.min(a[0],b[0]),y=Math.min(a[1],b[1]),w=Math.abs(a[0]-b[0]),h=Math.abs(a[1]-b[1]);t.clearRect(0,0,v.width,v.height);t.fillStyle=t.strokeStyle='#287df0';t.beginPath();switch(drag.tool){case 'rect':t.rect(x,y,w,h);break;case 'round':t.roundRect(x,y,w,h,Math.min(w,h,28)/2);break;case 'circle':{let d=Math.max(w,h);t.arc(a[0]+Math.sign(b[0]-a[0])*d/2,a[1]+Math.sign(b[1]-a[1])*d/2,d/2,0,Math.PI*2);break}case 'ellipse':t.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);break;case 'lasso':t.moveTo(...a);p.slice(1).forEach(q=>t.lineTo(...q));t.closePath();break;case 'brush':t.lineWidth=+$('size').value;t.lineCap=t.lineJoin='round';t.moveTo(...a);p.slice(1).forEach(q=>t.lineTo(...q));if(p.length===1)t.lineTo(a[0]+.01,a[1]);t.stroke();return}t.fill()}
v.onpointerdown=e=>{if(!meta)return;let p=point(e),tool=$('tool').value;if(tool==='lens')return;if(tool==='object'){let o=meta.objects[pg].slice().reverse().find(o=>[...$('obj').options].some(x=>+x.value===o.id)&&p[0]/v.width>=o.box[0]&&p[0]/v.width<=o.box[0]+o.box[2]&&p[1]/v.height>=o.box[1]&&p[1]/v.height<=o.box[1]+o.box[3]);if(o){$('obj').value=o.id;select()}return}drag={tool,pts:[p],combine:e.altKey?'subtract':e.shiftKey?'add':$('combine').value};v.setPointerCapture(e.pointerId);selection();draw()};v.onpointermove=e=>{hover=point(e);if(drag){drag.pts.push(hover);selection()}draw()};v.onpointerup=e=>{if(!drag)return;drag.pts.push(point(e));selection();let x=mask.getContext('2d');if(drag.combine==='replace')x.clearRect(0,0,v.width,v.height);x.globalCompositeOperation=drag.combine==='subtract'?'destination-out':'source-over';x.drawImage(temp,0,0);x.globalCompositeOperation='source-over';drag=null;draw()};v.onpointercancel=()=>{drag=null;draw()};v.onpointerleave=()=>{hover=null;draw()};
function add(o){ops.push(o);redo=[];list();draw()}$('apply').onclick=()=>run(async()=>{if(!meta||!refs[pg])throw Error('需要当前页原图');let w=v.width,h=v.height,q=mk();q.width=w;q.height=h;let x=q.getContext('2d');x.drawImage(refcan,0,0);x.globalCompositeOperation='destination-in';x.drawImage(mask,0,0);x.globalCompositeOperation='source-over';if($('protect').checked)for(let o of meta.objects[pg])if(o.text.trim()&&!ops.some(z=>z.kind==='delete'&&z.slide===pg&&z.id===o.id)){let b=o.box;x.clearRect(b[0]*w,b[1]*h,b[2]*w,b[3]*h)}let a=x.getImageData(0,0,w,h),l=w,t=h,r=-1,b=-1;for(let i=0;i<w*h;i++){let k=i*4;if($('cut').checked&&Math.min(...a.data.slice(k,k+3))>235)a.data[k+3]=0;if(a.data[k+3]){let xx=i%w,yy=Math.floor(i/w);l=Math.min(l,xx);r=Math.max(r,xx);t=Math.min(t,yy);b=Math.max(b,yy)}}if(r<l)throw Error('选区为空');let crop=mk();crop.width=r-l+1;crop.height=b-t+1;x.putImageData(a,0,0);crop.getContext('2d').drawImage(q,l,t,crop.width,crop.height,0,0,crop.width,crop.height);let o={kind:'patch',slide:pg,box:[l/w,t/h,crop.width/w,crop.height/h],png:crop.toDataURL(),protect:$('protect').checked,behind:$('behind').checked,anchor:active()?.id};patchImages.set(o,await image(o.png));add(o);clear();status('补丁已加入；可重新渲染核验图层。')});document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{if(active()){add({kind:b.dataset.op,id:active().id,slide:pg});status('对象操作已记录，请重新渲染。')}});$('layout').onclick=()=>{if(active()){let o={kind:'layout',slide:pg,id:active().id,box:['x','y','w','h'].map(k=>+$(k).value)};if(+$('font').value)o.font=+$('font').value;add(o);status('属性操作已记录，请重新渲染。')}};
async function reset(){base=await Promise.all(meta.pages.map(image));rendered=0;list();draw()}$('undo').onclick=()=>run(async()=>{if(ops.length){redo.push(ops.pop());await reset()}});$('redo').onclick=()=>run(async()=>{if(redo.length){ops.push(redo.pop());await reset()}});$('preview').onclick=()=>run(async()=>{if(!source)return;status('正在重新渲染…');let d=await(await post('/preview',{pptx:source,ops})).json();base=await Promise.all(d.pages.map(image));rendered=ops.length;draw();status('已更新真实 PPTX 渲染')});$('export').onclick=()=>run(async()=>{if(!source)return;let r=await post('/export',{pptx:source,ops}),u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download='repaired.pptx';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);status('PPTX 已导出')});document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key.toLowerCase()==='q'){peek=true;draw()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$(e.shiftKey?'redo':'undo').click()}if(e.key==='Escape')clear()});document.addEventListener('keyup',e=>{if(e.key.toLowerCase()==='q'){peek=false;draw()}});
</script></html>
