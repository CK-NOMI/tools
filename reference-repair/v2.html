<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference Repair Studio 2 · 对象编辑</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#263447;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,.file{border:1px solid #d7dfea;border-radius:7px;background:#fff;color:#24364e;padding:8px 11px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary{background:#246ce6;color:white;border-color:#246ce6}button.active{background:#e5efff;color:#155acb;border-color:#98bbff}header{background:#fff;border-bottom:1px solid #dce3ed;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 16px}header strong{font-size:17px;margin-right:8px}header a{color:#63728a;text-decoration:none;margin-left:auto}input[type=file]{display:none}.toolbar{background:#fff;border-bottom:1px solid #dce3ed;padding:8px 16px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.toolbar .right{margin-left:auto}.layout{display:grid;grid-template-columns:128px minmax(0,1fr) 260px;min-height:calc(100vh - 106px)}aside{background:#fff;padding:12px;border-right:1px solid #dce3ed;min-width:0}aside:last-child{border-right:none;border-left:1px solid #dce3ed}#pages button{width:100%;margin:6px 0;padding:5px}#pages img{width:100%;display:block}#pages small{display:block;padding:4px}.center{padding:20px;min-width:0;align-self:start}#board{position:relative;margin:auto;max-width:1200px;background:white;box-shadow:0 5px 24px #23344b20;overflow:visible;touch-action:none;user-select:none}#scene,#exact,#overlay,#selection{position:absolute;inset:0}#scene{overflow:hidden}#exact,#overlay{width:100%;height:100%;pointer-events:none;object-fit:fill}#overlay{opacity:0}#selection{pointer-events:none}.object{position:absolute;display:flex;align-items:flex-start;overflow:hidden;transform-origin:center;cursor:move;white-space:pre-wrap;overflow-wrap:anywhere}.object img{width:100%;height:100%;pointer-events:none;object-fit:fill}.unsupported{border:1px dashed #b1b9c6;background:#a9b7c41a;color:#7a8492;font-size:10px}.outline{position:absolute;border:2px solid #2478ff;transform-origin:center;pointer-events:none}.handle{position:absolute;width:10px;height:10px;background:white;border:1.5px solid #2478ff;pointer-events:auto;transform:translate(-50%,-50%)}.region{position:absolute;background:#246ce62a;border:2px dashed #246ce6}.editor{position:absolute;z-index:20;resize:none;border:2px solid #246ce6;background:#ffffffed;padding:3px;user-select:text}.status{margin:12px 0;color:#68788e;overflow-wrap:anywhere}h3{font-size:14px;margin:10px 0}label.field{display:flex;flex-direction:column;gap:4px;color:#68788e;font-size:12px}input[type=number],input[type=text],textarea,select{width:100%;min-width:0;border:1px solid #d7dfea;padding:6px;border-radius:6px;color:#25364b;background:white}textarea{resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.layers{max-height:235px;overflow:auto}.layers button{display:block;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;margin:3px 0;font-size:12px;padding:6px}.note{font-size:12px;color:#68788e;line-height:1.6}.section{border-top:1px solid #e1e7ef;margin-top:14px;padding-top:6px}dialog{border:1px solid #dce3ed;border-radius:12px;padding:18px;max-width:90vw;box-shadow:0 12px 45px #23344b33}dialog::backdrop{background:#20304966}dialog img{max-width:100%;max-height:45vh;object-fit:contain;display:block;margin:10px auto}#history{max-height:170px;overflow:auto}.history-row{display:flex;justify-content:space-between;gap:5px;font-size:12px;padding:5px;border-bottom:1px solid #edf0f4}#region-tools[hidden],#props[hidden],#exact[hidden],#overlay[hidden]{display:none}@media(max-width:850px){.layout{grid-template-columns:75px minmax(0,1fr)}aside:last-child{grid-column:1/-1}.center{padding:9px}}
</style></head><body>
<header><strong>Reference Repair Studio 2</strong><label class="file">打开 PPTX<input id="pptx" type="file" accept=".pptx"></label><label class="file">本页原图<input id="reference" type="file" accept="image/*"></label><button id="sample">城市样例</button><button id="export" class="primary" disabled>导出 PPTX</button><a href="/legacy">旧版修复工作台</a></header>
<div class="toolbar"><button id="select" class="active">选择对象</button><button id="region">原图取件</button><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button><button id="verify" disabled>真实渲染</button><button id="live" disabled>回到编辑</button><label>原图叠加 <input id="opacity" type="range" min="0" max="100" value="0"></label><span class="right note" id="mode">编辑预览（近似）</span></div>
<div class="layout"><aside><h3>页面</h3><div id="pages"></div></aside><main class="center"><div id="board" style="aspect-ratio:16/9"><div id="scene"></div><img id="exact" hidden alt="真实渲染"><img id="overlay" hidden alt="原始设计"><div id="selection"></div></div><p id="status" class="status">打开 PPTX 或城市样例开始编辑。</p><p class="note">点击对象拖动；八个控制点缩放；双击文字编辑；Delete 删除；方向键微调。按 Q 临时查看原图。真实渲染用于核验导出效果。</p></main>
<aside><h3>对象属性</h3><div id="empty" class="note">点击画布中的对象开始编辑。</div><div id="props" hidden><strong id="name"></strong><p id="kind" class="note"></p><div class="fields"><label class="field">X (%)<input id="x" type="number" step=".1"></label><label class="field">Y (%)<input id="y" type="number" step=".1"></label><label class="field">宽 (%)<input id="w" type="number" step=".1" min=".1"></label><label class="field">高 (%)<input id="h" type="number" step=".1" min=".1"></label><label class="field">旋转 (°)<input id="rotation" type="number" step="1"></label></div>
<div id="textprops" hidden><div class="fields"><label class="field">字体<input id="font" type="text"></label><label class="field">字号 (pt)<input id="size" type="number" min="1" max="400"></label><label class="field">颜色<input id="color" type="color"></label><label class="field">对齐<select id="align"><option value="left">左</option><option value="center">中</option><option value="right">右</option></select></label></div><div class="actions"><button id="bold">加粗</button><button id="italic">斜体</button><button id="edittext">编辑文字</button></div></div>
<div class="actions"><button id="front">置顶</button><button id="back">置底</button><button id="delete">删除</button></div><button id="recover" class="primary">从原图替换图片</button><p id="recover-note" class="note">仅图片对象可替换，保持原层级，不额外堆叠。</p></div><div class="section"><h3>图层</h3><div id="layers" class="layers"></div></div><div class="section"><h3>操作历史</h3><div id="history"></div><p id="total" class="note"></p></div></aside></div>
<dialog id="candidate"><h3>确认原图修复</h3><p id="candidate-note" class="note"></p><img id="candidate-img" alt="原图裁剪候选"><div class="actions"><button id="cancel">取消</button><button id="confirm" class="primary">应用修复</button></div></dialog>
<script src="/v2.js"></script></body></html>
